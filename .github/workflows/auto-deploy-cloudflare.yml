name: Deploy to Cloudflare Workers Assets

on:
  push:
    branches: [ master ]
  workflow_dispatch:  # 也允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the latest cn.txt
        run: curl -L https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt -o cidrs-cn.txt

      - name: Run generation script
        run: |
          mkdir -p dist
          ./gfw-pac.py -f dist/proxy.pac -p "SOCKS5 127.0.0.1:7890; PROXY 127.0.0.1:7890" --proxy-domains=proxy-domains.txt --direct-domains=direct-domains.txt --localtld-domains=local-tlds.txt --ip-file=cidrs-cn.txt

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --assets ./dist --name gfw-pac --compatibility-date 2026-10-21